<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - Abdo Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

        navbar {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--primary); }

        .product-detail-container {
            padding: 40px 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .main-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .product-info-details h1 { font-size: 32px; font-weight: 800; margin-bottom: 15px; }
        .price-tag { font-size: 28px; color: var(--primary); font-weight: 800; margin-bottom: 20px; }
        .price-tag span { font-size: 16px; color: var(--text-muted); text-decoration: line-through; margin-right: 10px; }

        .description { color: var(--text-muted); line-height: 1.8; margin-bottom: 30px; font-size: 15px; }

        .btn-add-cart {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }
        .btn-add-cart:hover { opacity: 0.9; transform: translateY(-2px); }

        @media (max-width: 768px) {
            .product-detail-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <navbar>
        <a href="index.html" class="logo"><i class="fa-solid fa-bag-shopping" style="color: var(--primary);"></i> Abdo<span>Shop</span></a>
        <a href="index.html" style="color: var(--text-muted); text-decoration: none;"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
    </navbar>

    <div class="product-detail-container">
        <div>
            <img id="p-img" class="main-img" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80" alt="منتج">
        </div>
        <div class="product-info-details">
            <span id="p-cat" style="color: var(--primary); font-weight: bold;">إلكترونيات / سماعات</span>
            <h1 id="p-title" style="margin-top: 10px;">سماعات رأس لاسلكية احترافية</h1>
            <div id="p-price" class="price-tag">999 ج.م <span>1,500 ج.م</span></div>
            <p id="p-desc" class="description">
                تمتع بتجربة صوتية نقية واستثنائية مع هذه السماعات اللاسلكية ذات التقنية العالية. تتميز بخاصية عزل الضوضاء، وعمر بطارية يدوم حتى 30 ساعة متواصلة مع وسادات أذن مريحة للاستخدام الطويل.
            </p>
            <a href="cart.html" class="btn-add-cart"><i class="fa-solid fa-cart-plus"></i> إتمام الشراء الآن</a>
        </div>
    </div>

    <script>
        const products = {
            "1": {
                title: "سماعات رأس لاسلكية احترافية",
                cat: "إلكترونيات / سماعات",
                price: "999 ج.م <span>1,500 ج.م</span>",
                img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80",
                desc: "تمتع بتجربة صوتية نقية واستثنائية مع هذه السماعات اللاسلكية ذات التقنية العالية. تتميز بخاصية عزل الضوضاء، وعمر بطارية يدوم حتى 30 ساعة متواصلة مع وسادات أذن مريحة للاستخدام الطويل."
            },
            "2": {
                title: "ساعة ذكية رياضية متطورة",
                cat: "ساعات / ذكية",
                price: "1,499 ج.م <span>2,200 ج.م</span>",
                img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80",
                desc: "ساعة ذكية فاخرة بشاشة AMOLED عالية الدقة، تتبع نبضات القلب والنشاط الرياضي ومقاومة للماء بالكامل مع بطارية شحن سريع تدوم لأسبوع."
            },
            "3": {
                title: "حذاء رياضي مريح للجري",
                cat: "أزياء / أحذية",
                price: "799 ج.م <span>1,200 ج.م</span>",
                img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80",
                desc: "حذاء رياضي مصمم بعناية ليمنحك أعلى درجات الراحة أثناء المشي والجري. خامات جودة ممتازة ونعل مرن يمتص الصدمات."
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id') || "1";

        if(products[productId]) {
            document.getElementById('p-title').innerText = products[productId].title;
            document.getElementById('p-cat').innerText = products[productId].cat;
            document.getElementById('p-price').innerHTML = products[productId].price;
            document.getElementById('p-img').src = products[productId].img;
            document.getElementById('p-desc').innerText = products[productId].desc;
        }
    </script>
</body>
</html>
