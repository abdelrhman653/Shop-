<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة الشراء - Abdo Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

        navbar {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--primary); }

        .cart-container {
            padding: 40px 5%;
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .cart-box, .checkout-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .cart-item img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-confirm:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            .cart-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <navbar>
        <a href="index.html" class="logo"><i class="fa-solid fa-bag-shopping" style="color: var(--primary);"></i> Abdo<span>Shop</span></a>
        <a href="index.html" style="color: var(--text-muted); text-decoration: none;"><i class="fa-solid fa-arrow-right"></i> متابعة التسوق</a>
    </navbar>

    <div class="cart-container">
        <div class="cart-box">
            <h2 style="margin-bottom: 20px; font-size: 20px;">المنتج المطلوب</h2>
            
            <div class="form-group">
                <label>اختر المنتج:</label>
                <select id="productSelect" onchange="updateProductDetails()">
                    <option value="سماعات رأس لاسلكية احترافية|999 ج.م|https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=200&q=80">سماعات رأس لاسلكية احترافية - 999 ج.م</option>
                    <option value="ساعة ذكية رياضية متطورة|1,499 ج.م|https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=200&q=80">ساعة ذكية رياضية متطورة - 1,499 ج.م</option>
                    <option value="حذاء رياضي مريح للجري|799 ج.م|https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=200&q=80">حذاء رياضي مريح للجري - 799 ج.م</option>
                </select>
            </div>

            <div class="cart-item">
                <img id="c-img" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=200&q=80" alt="منتج">
                <div style="flex-grow: 1;">
                    <h4 id="c-title" style="font-size: 15px;">سماعات رأس لاسلكية احترافية</h4>
                    <span id="c-price" style="color: var(--primary); font-weight: bold;">999 ج.م</span>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 20px; font-size: 18px;">
                <span>الإجمالي:</span>
                <span id="c-total" style="color: var(--primary);">999 ج.م</span>
            </div>
        </div>

        <div class="checkout-box">
            <h2 style="margin-bottom: 20px; font-size: 20px;">بيانات الشحن</h2>
            <form onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="cust_name" placeholder="أدخل اسمك الثلاثي" required>
                </div>
                <div class="form-group">
                    <label>رقم الموبايل للتواصل</label>
                    <input type="tel" id="cust_phone" placeholder="01xxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل</label>
                    <input type="text" id="cust_address" placeholder="المحافظة - المدينة - الشارع" required>
                </div>
                <button type="submit" class="btn-confirm">
                    <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> تأكيد الطلب عبر الواتساب
                </button>
            </form>
        </div>
    </div>

    <script>
        function updateProductDetails() {
            var select = document.getElementById('productSelect');
            var values = select.value.split('|');
            document.getElementById('c-title').innerText = values[0];
            document.getElementById('c-price').innerText = values[1];
            document.getElementById('c-total').innerText = values[1];
            document.getElementById('c-img').src = values[2];
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            
            // رقم الواتساب المربوط
            var myPhoneNumber = "201555889862"; 

            var name = document.getElementById('cust_name').value;
            var phone = document.getElementById('cust_phone').value;
            var address = document.getElementById('cust_address').value;
            var productTitle = document.getElementById('c-title').innerText;
            var productPrice = document.getElementById('c-price').innerText;

            var message = "*طلب جديد من متجر Abdo Shop 🛍️*" + "%0A%0A" +
                          "👤 *اسم العميل:* " + encodeURIComponent(name) + "%0A" +
                          "📞 *رقم التليفون:* " + encodeURIComponent(phone) + "%0A" +
                          "📍 *العنوان:* " + encodeURIComponent(address) + "%0A%0A" +
                          "📦 *المنتج:* " + encodeURIComponent(productTitle) + "%0A" +
                          "💰 *الإجمالي:* " + encodeURIComponent(productPrice) + "%0A%0A" +
                          "برجاء تأكيد الطلب والشحن في أسرع وقت ممكن! 🔥";

            var whatsappUrl = "https://wa.me/" + myPhoneNumber + "?text=" + message;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>

</body>
</html>
